name: orchestra
version: 0.3.2
display_name: Abraxas Orchestra
kind: hermes-openclaw-skill

description: >
  Hermes and OpenClaw coding-agent skill for symbolic code architecture.
  Structure modules, pipelines, interfaces, and agent systems according to
  traditional esoteric maps while remaining production-grade.
  Fail-closed on weak mappings. Dual-named skeletons with recoverable provenance.
  Analyze local Python trees and emit optimize plans without silent mutation.
  Corpus remains open for expansion with additional traditional systems.

homepage: https://github.com/scrimshawlife-ctrl/Abraxas-Orchestra-Hermes
repository: https://github.com/scrimshawlife-ctrl/Abraxas-Orchestra-Hermes

skill_entry: SKILL.md
cli_entry: scripts/orchestra.py
installer: install.sh

hosts:
  - hermes
  - openclaw

install:
  hermes_path: ~/.hermes/skills/orchestra
  openclaw_path: ~/.openclaw/skills/orchestra
  atomic: true
  supports_dry_run: true
  supports_rollback: true
  path_jail_home: true

frameworks:
  - tree-of-life
  - alchemical-stages
  - elder-futhark
  - planetary-spheres
  - iching-hexagrams
  - solomonic
  - peircean-signs
  - numogram
  - sacred-geometry
  - enochian
  - chaos-magic

intents:
  - check
  - list
  - structure
  - project
  - diagram
  - analyze
  - optimize

schemas:
  correspondence_table: schemas/correspondence-table.v1.schema.json
  frameworks: schemas/frameworks.v1.json
  analysis: schemas/analysis.v1.schema.json
  optimize_plan: schemas/optimize-plan.v1.schema.json
  optimize_apply: schemas/optimize-apply.v1.schema.json

examples:
  - examples/signal-forager-skeleton/
  - examples/enochian-chaos-skeleton/

governance:
  fail_closed: true
  human_sovereignty: true
  no_auto_canon_promotion: true
  observed_first: true
  corpus_open: true

license: Apache-2.0

metadata:
  abraxas_family: true
  design_doc: docs/DESIGN.md
  openclaw_doc: docs/OPENCLAW.md
  roadmap_doc: docs/ROADMAP.md
  release_notes: docs/RELEASE_NOTES.md
  security_doc: docs/SECURITY.md
  completion_doc: docs/COMPLETION.md
  public_release_doc: docs/PUBLIC_RELEASE.md
  security_audit: docs/SECURITY_AUDIT.md
  min_python: "3.11"
  skill_type: coding-agent
