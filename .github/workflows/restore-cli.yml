name: restore-cli

# One-shot self-heal: restores scripts/orchestra.py from a known-good commit
# if the file on main is truncated. Safe to leave; no-ops when CLI is intact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-cli
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect truncation and restore
        run: |
          set -euo pipefail
          GOOD_SHA=107b0f65c2321651fcf365472b9a65bba3b86c18
          if grep -q 'def cmd_optimize' scripts/orchestra.py && grep -q 'def main' scripts/orchestra.py; then
            echo "orchestra.py looks intact — no restore needed"
            # clean accidental placeholder if present
            if [ -f scripts/_orchestra_part_0.b64 ]; then
              rm -f scripts/_orchestra_part_0.b64
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -u scripts/_orchestra_part_0.b64
              git commit -m "chore: remove emergency placeholder part file" || true
              git push || true
            fi
            exit 0
          fi

          echo "TRUNCATED orchestra.py detected — restoring from ${GOOD_SHA}"
          git show "${GOOD_SHA}:scripts/orchestra.py" > scripts/orchestra.py
          python3 -c "
          from pathlib import Path
          p = Path('scripts/orchestra.py')
          t = p.read_text()
          t = t.replace('VERSION = \"0.3.1\"', 'VERSION = \"0.3.2\"', 1)
          p.write_text(t)
          assert 'def cmd_optimize' in t
          assert 'VERSION = \"0.3.2\"' in t
          print('restored', len(t), 'bytes')
          "

          rm -f scripts/_orchestra_part_0.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/orchestra.py
          git add -u scripts/_orchestra_part_0.b64 2>/dev/null || true
          git status
          git commit -m "fix: restore full scripts/orchestra.py at VERSION 0.3.2"
          git push

      - name: Verify restored CLI
        run: |
          set -euo pipefail
          python3 scripts/orchestra.py check
          python3 scripts/orchestra.py --version
