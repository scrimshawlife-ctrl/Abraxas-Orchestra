name: release

# Automated GitHub Release when a version tag is pushed.
# Tag must match VERSION file: v0.4.0 ↔ 0.4.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — do not create/update the Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag and VERSION
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
            echo "workflow_dispatch: using VERSION file → ${TAG}"
          fi
          V="${TAG#v}"
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG} FILE_VERSION=${FILE_V}"
          if [[ "${V}" != "${FILE_V}" ]]; then
            echo "::error::Tag ${TAG} does not match VERSION file (${FILE_V}). Refuse release."
            exit 1
          fi
          python3 scripts/bump_version.py check
          echo "parity OK"

      - name: Smoke
        run: bash scripts/smoke.sh

      - name: CLI check
        run: |
          out="$(python3 scripts/orchestra.py check)"
          echo "$out"
          echo "$out" | grep -q "CHECK OK — Orchestra ${{ steps.meta.outputs.version }}"

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          V: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY="docs/RELEASE_BODY_${TAG}.md"
          OUT="${RUNNER_TEMP}/release_notes.md"
          if [[ -f "$BODY" ]]; then
            cp "$BODY" "$OUT"
            echo "Using ${BODY}"
          else
            python3 -c "
          import re, pathlib, os
          v, repo, out = os.environ['V'], os.environ['REPO'], '${OUT}'
          lines = [
              f'## Orchestra {v}',
              '',
              f'See [CHANGELOG](https://github.com/{repo}/blob/main/CHANGELOG.md) and '
              f'[RELEASE_NOTES](https://github.com/{repo}/blob/main/docs/RELEASE_NOTES.md).',
              '',
          ]
          path = pathlib.Path('CHANGELOG.md')
          if path.is_file():
              text = path.read_text(encoding='utf-8')
              m = re.search(rf'## \\[{re.escape(v)}\\].*?(?=\\n## |\\Z)', text, re.S)
              if m:
                  lines.append(m.group(0).strip())
          pathlib.Path(out).write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
          print('Synthesized notes')
          "
          fi
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"
          head -30 "$OUT"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating notes"
            gh release edit "$TAG" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" \
              --title "Orchestra ${TAG#v}" \
              --notes-file "$NOTES" \
              --latest \
              --verify-tag
          fi
          echo "Release URL:"
          gh release view "$TAG" --json url -q .url

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "Dry-run only — no Release created."
          echo "Tag would be: ${{ steps.meta.outputs.tag }}"
          echo "Notes:"
          cat "${{ steps.notes.outputs.path }}"
